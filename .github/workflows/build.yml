name: "build_publish_deploy"

on:
   push:
      branches:
         - master

permissions:
   contents: read

jobs:
   build_and_publish:
      permissions:
         contents: read
         packages: write
      name: "Build and Publish"
      runs-on: davidapps-linux-x64
      steps:
         - name: checkout
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         - name: login to ghcr.io
           uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
           with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
         - name: set up Docker Buildx
           uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
         - name: build and push to container registry
           uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
           with:
              context: .
              push: true
              cache-from: type=gha,scope=vps-update-wireguard
              cache-to: type=gha,mode=max,scope=vps-update-wireguard
              tags: ghcr.io/davidilie/vps-update-wireguard:latest
   deploy_self:
      name: "Deploy Self"
      runs-on: davidapps-linux-x64
      needs: [build_and_publish]
      steps:
         - name: "Set up kubectl"
           uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
         - name: "Set Kubernetes Context"
           uses: Azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
           with:
              method: kubeconfig
              kubeconfig: ${{ secrets.KUBE_CONFIG }}
         - name: "Restart deployment on DavidIlie's instance"
           run: kubectl rollout restart deploy vps-update-wireguard -n internal
